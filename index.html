<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>바람 레벨 환산기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --ground:#eef1f4; --panel:#ffffff; --ink:#18202c; --muted:#5b6676; --line:#d5dbe3;
  --accent:#1f6f62; --accent-ink:#ffffff; --accent-soft:#dcefeb; --warn:#9a5b00; --warn-soft:#fbefd9;
  --serif:"Gowun Batang","Noto Serif KR",serif; --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#10151d; --panel:#18202b; --ink:#e7ebf1; --muted:#9aa5b4; --line:#2c3644;
    --accent:#4fb3a2; --accent-ink:#0d1a17; --accent-soft:#17312d; --warn:#f0b357; --warn-soft:#33270f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#10151d; --panel:#18202b; --ink:#e7ebf1; --muted:#9aa5b4; --line:#2c3644;
  --accent:#4fb3a2; --accent-ink:#0d1a17; --accent-soft:#17312d; --warn:#f0b357; --warn-soft:#33270f; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:28px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header h1{font-family:var(--serif);font-size:30px;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
header p{margin:6px 0 0;color:var(--muted)}
.tag{display:inline-block;font-size:12px;letter-spacing:.06em;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:2px 8px;margin-bottom:10px}
form{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:16px}
.lab{font-size:13px;color:var(--muted);margin-bottom:6px;display:block}
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tiers input{position:absolute;opacity:0;pointer-events:none}
.tiers label{display:block;text-align:center;border:1px solid var(--line);border-radius:7px;padding:9px 0;cursor:pointer;font-weight:500;background:var(--ground)}
.tiers input:checked+label{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tiers input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
input[type=number]{width:100%;font:500 18px var(--mono);color:var(--ink);background:var(--ground);border:1px solid var(--line);border-radius:7px;padding:9px 11px}
input[type=number]:focus{outline:2px solid var(--accent);outline-offset:1px}
.unit{display:flex;gap:14px;margin-top:6px;font-size:13px;color:var(--muted)}
.unit label{display:flex;gap:5px;align-items:center;cursor:pointer}
.hint{font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.result{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px}
.arrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.side .k{font-size:12px;color:var(--muted)}
.side .v{font-family:var(--serif);font-size:26px;font-weight:700;line-height:1.25}
.side.new .v{color:var(--accent);font-size:34px}
.side .s{font:500 13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.mid{color:var(--muted);font-size:22px}
.bar{height:8px;border-radius:4px;background:var(--ground);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);width:0}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:13px}
dt{color:var(--muted)} dd{margin:0;text-align:right;font:500 13px var(--mono);font-variant-numeric:tabular-nums}
.err{color:var(--warn);background:var(--warn-soft);border-radius:7px;padding:10px 12px;font-size:14px}
.notes{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px;padding:0 4px}
.notes b{color:var(--ink);font-weight:500}
@media (max-width:420px){.side .v{font-size:22px}.side.new .v{font-size:28px}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <span class="tag">패치 예정 · 계획안</span>
    <h1>내 레벨은 몇이 될까</h1>
    <p>초급·중급·고급이 <b>1~99 한 줄</b>로 바뀝니다. 지금 레벨과 경험치 %를 넣으면 바뀐 뒤 레벨을 바로 계산해 드려요.</p>
  </header>

  <form id="f" novalidate>
    <div>
      <span class="lab">지금 단계</span>
      <div class="tiers">
        <input type="radio" name="tier" id="t0" value="0"><label for="t0">초급</label>
        <input type="radio" name="tier" id="t1" value="1"><label for="t1">중급</label>
        <input type="radio" name="tier" id="t2" value="2" checked><label for="t2">고급</label>
        <input type="radio" name="tier" id="t3" value="3"><label for="t3">마스터</label>
      </div>
    </div>
    <div class="row" id="inputs">
      <div>
        <label class="lab" for="lv">레벨</label>
        <input type="number" id="lv" inputmode="numeric" min="1" value="59">
        <div class="hint" id="lvHint">1 ~ 99</div>
      </div>
      <div>
        <label class="lab" for="ex" id="exLab">지금 경험치 (%)</label>
        <input type="number" id="ex" inputmode="decimal" min="0" step="0.1" value="49.7">
        <div class="unit">
          <label><input type="radio" name="unit" id="uPct" value="pct" checked> %로 넣기</label>
          <label><input type="radio" name="unit" id="uNum" value="num"> 숫자로 넣기</label>
        </div>
        <div class="hint" id="exHint"></div>
      </div>
    </div>
  </form>

  <section class="result" id="res" aria-live="polite"></section>

  <div class="notes">
    <div><b>어떻게 계산하나요?</b> 1레벨부터 지금까지 쌓은 경험치를 모두 더해서, 새 1~99 표 어디에 떨어지는지 봅니다. 그래서 <b>99까지 남은 경험치는 지금과 똑같아요.</b></div>
    <div>초급(1~20)은 표가 같아서 그대로이고, 마스터도 그대로입니다. 이미 낸 재료는 다시 받지 않아요.</div>
    <div>아직 적용 전인 계획 숫자예요. 실제 패치 때 표가 바뀌면 이 계산기도 고쳐 둘게요.</div>
  </div>
</div>

<script>
const D = {"old": {"t0": [8, 20, 30, 40, 50, 100, 150, 200, 250, 300, 600, 900, 1200, 1500, 1800, 2100, 2400, 2700, 3000, 10500], "t1": [8, 20, 30, 40, 50, 100, 150, 200, 250, 300, 600, 900, 1200, 1500, 1800, 2100, 2400, 2700, 3000, 10500, 25002, 29001, 34401, 42300, 55002, 55002, 64707, 78573, 100002, 137502, 151251, 166377, 183015, 201318, 221451, 243597, 267957, 294753, 324228, 356652, 392316, 431547, 474702, 522171, 574389, 631827, 695010, 764511, 840963, 925059], "t2": [16, 40, 60, 80, 100, 200, 300, 400, 500, 600, 1200, 1800, 2400, 3000, 3600, 4200, 4800, 5400, 6000, 18900, 45000, 52200, 61900, 76100, 88000, 88000, 103500, 125700, 160000, 206300, 226900, 249600, 274500, 302000, 310000, 341000, 375100, 412700, 453900, 463600, 510000, 561000, 617100, 678800, 746700, 821400, 903500, 993900, 1093300, 1202600, 1238700, 1275800, 1314100, 1353500, 1394100, 1435900, 1479000, 1523400, 1569100, 1616200, 1664600, 1714600, 1766000, 1819000, 1873600, 1929800, 1987700, 2047300, 2108700, 2172000, 2237100, 2304300, 2373400, 2444600, 2517900, 2593500, 2671300, 2751400, 2834000, 2975700, 3124500, 3280700, 3444700, 3617000, 3797800, 3987700, 4187100, 4396500, 4616300, 4847100, 5089500, 5343900, 5611100, 5891700, 6186300, 6495600, 6820400, 7161400, 7519500]}, "neu": [8, 20, 30, 40, 50, 100, 150, 200, 250, 300, 600, 900, 1200, 1500, 1800, 2100, 2400, 2700, 3000, 10500, 27900, 32900, 38600, 45100, 52600, 61000, 70500, 81200, 93300, 106700, 121800, 138500, 157100, 177800, 200700, 225900, 253700, 284300, 317900, 354700, 395000, 438900, 486900, 539200, 596000, 657700, 724500, 797000, 875300, 959734, 1048500, 1125700, 1195000, 1259400, 1320900, 1381300, 1441700, 1502700, 1565100, 1629300, 1695500, 1764100, 1835100, 1908900, 1985500, 2065100, 2147900, 2233900, 2323400, 2416400, 2513200, 2613800, 2718400, 2827200, 2940400, 3058100, 3180600, 3307900, 3440300, 3578000, 3721200, 3870200, 4025100, 4186300, 4353900, 4528100, 4709400, 4897900, 5094000, 5297900, 5510000, 5730600, 5960000, 6198500, 6446700, 6704700, 6973100, 7252596, 7519500]};
const TIER = ["초급","중급","고급","마스터"];
const CAP = [20,50,99,1];
const fmt = n => Math.round(n).toLocaleString("ko-KR");
const $ = id => document.getElementById(id);

// 새 표 누적치: CN[N] = 새 1레벨부터 N레벨이 될 때까지 필요한 합
const CN = [0,0]; for (let N=1; N<=99; N++) CN[N+1] = CN[N] + D.neu[N-1];
const NEED_OLD = (t,L) => t===0 ? D.old.t0[L-1] : t===1 ? D.old.t1[L-1] : D.old.t2[L-1];

function oldTotal(t,L,exp){
  let C = 0;
  for (let tt=0; tt<=t; tt++){
    const last = tt===t ? L-1 : CAP[tt];
    for (let k=1; k<=last; k++) C += NEED_OLD(tt,k);
  }
  return C + exp;
}
function newPos(C){
  let N = 1;
  while (N < 99 && CN[N+1] <= C) N++;
  return { N, exp: C - CN[N] };
}
function oldText(t,L){ return t===0 ? `${L}` : `${TIER[t]} ${L}`; }

function render(){
  const t = +document.querySelector('input[name=tier]:checked').value;
  const pct = $("uPct").checked;
  const res = $("res");
  $("inputs").hidden = t===3;
  if (t===3){
    res.innerHTML = `<div class="arrow"><div class="side"><div class="k">지금</div><div class="v">마스터</div></div><div class="mid">→</div><div class="side new"><div class="k">바뀐 뒤</div><div class="v">마스터</div></div></div><div class="hint">마스터는 그대로예요. 쌓아 둔 경험치도 그대로 남습니다.</div>`;
    return;
  }
  $("lv").max = CAP[t];
  $("lvHint").textContent = `1 ~ ${CAP[t]}`;
  const L = Math.floor(+$("lv").value);
  if (!(L>=1 && L<=CAP[t])){ res.innerHTML = `<div class="err">${TIER[t]} 레벨은 1부터 ${CAP[t]}까지예요.</div>`; $("exHint").textContent=""; return; }
  const need = NEED_OLD(t,L);
  $("exLab").textContent = pct ? "지금 경험치 (%)" : "지금 경험치 (숫자)";
  $("exHint").textContent = pct ? "게임 화면에 보이는 % 그대로 넣으세요" : `이 레벨 100% = ${fmt(need)}`;
  let raw = +$("ex").value;
  if (!(raw>=0)){ res.innerHTML = `<div class="err">경험치는 0 이상으로 넣어 주세요.</div>`; return; }
  const exp = pct ? need*raw/100 : raw;
  const C = oldTotal(t,L,exp);
  const p = newPos(C);
  const nNeed = D.neu[p.N-1];
  const nPct = Math.min(999, p.exp/nNeed*100);
  const oPct = exp/need*100;
  const left = CN[100] - C;
  const over = exp > need ? `<div class="hint">100%보다 많이 넣으셨어요. 넘친 만큼도 그대로 옮겨 계산했어요.</div>` : "";
  res.innerHTML = `
    <div class="arrow">
      <div class="side"><div class="k">지금</div><div class="v">${oldText(t,L)}</div><div class="s">${oPct.toFixed(1)}%</div></div>
      <div class="mid">→</div>
      <div class="side new"><div class="k">바뀐 뒤</div><div class="v">${p.N}레벨</div><div class="s">${nPct.toFixed(1)}%</div></div>
    </div>
    <div class="bar"><i style="width:${Math.min(100,nPct)}%"></i></div>
    <dl>
      <dt>새 레벨 경험치</dt><dd>${fmt(p.exp)} / ${fmt(nNeed)}</dd>
      <dt>1레벨부터 쌓은 경험치</dt><dd>${fmt(C)}</dd>
      <dt>99 → 마스터까지 남은 경험치</dt><dd>${left>0?fmt(left):"0 (다 모음)"}</dd>
    </dl>${over}`;
}
document.getElementById("f").addEventListener("input", render);
document.getElementById("f").addEventListener("submit", e => e.preventDefault());
// 단위를 바꾸면 넣어 둔 값을 그 단위로 바꿔 준다(같은 경험치 유지).
document.querySelectorAll('input[name=unit]').forEach(r => r.addEventListener("change", () => {
  const t = +document.querySelector('input[name=tier]:checked').value;
  const L = Math.floor(+$("lv").value);
  if (t < 3 && L >= 1 && L <= CAP[t]) {
    const need = NEED_OLD(t,L), v = +$("ex").value;
    if (v >= 0) $("ex").value = $("uPct").checked ? (v/need*100).toFixed(1) : Math.round(need*v/100);
  }
  $("ex").step = $("uPct").checked ? "0.1" : "1";
  render();
}));
document.querySelectorAll('input[name=tier]').forEach(r => r.addEventListener("change", () => {
  const t = +document.querySelector('input[name=tier]:checked').value;
  if (t<3 && +$("lv").value > CAP[t]) $("lv").value = CAP[t];
  render();
}));
render();
</script>

</body>
</html>
